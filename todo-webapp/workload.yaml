apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: todo-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: simplest-todo4112-todo-api
      name: http
      visibility: project
      envBindings:
        address: TODO_API_URL
  resources:
    - ref: simplest-todo4112-c8896896
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
